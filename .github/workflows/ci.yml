name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]  # 3.13 = what Termux (Android) ships
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (verifies Dockerfile incl. Playwright/Chromium)
        run: docker build -t ai-agent-tender:ci .
      - name: Smoke test (imports + migrations inside the image)
        run: |
          docker run --rm -e GOOGLE_API_KEY=x -e TELEGRAM_BOT_TOKEN=1:x -e TELEGRAM_OWNER_CHAT_ID=1 \
            ai-agent-tender:ci python -c "import asyncio, app.main; from app.db.session import run_migrations; asyncio.run(run_migrations('sqlite+aiosqlite:////tmp/t.db')); print('ok')"
