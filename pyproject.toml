[project]
name = "freelancehunter"
version = "0.1.0"
description = "Self-hosted AI agent that finds freelance jobs, drafts proposals (human-approved) and tracks them."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "google-genai>=1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pypdf>=5.0",
    "playwright>=1.48",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC240"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
